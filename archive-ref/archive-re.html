<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>archive refractor</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.3/jquery-ui.min.js"></script>

    <style>
      /* font-faces */
      :root {
        --color: FF8600;
      }
      @font-face {
        font-family: goozette;
        src: url("https://cdn.jsdelivr.net/gh/rararaforever/orbit-fonts@main/goozette/Goozette.otf")
          format("opentype");
        font-display: swap;
      }

      /* Avara */
      @font-face {
        font-family: avara;
        src:
          url("https://cdn.jsdelivr.net/gh/rararaforever/orbit-fonts@main/avara/Avara-Black.woff2")
            format("woff2"),
          url("https://cdn.jsdelivr.net/gh/rararaforever/orbit-fonts@main/avara/Avara-Black.woff")
            format("woff");
        font-weight: 900;
        font-display: swap;
      }

      @font-face {
        font-family: avara;
        src:
          url("https://cdn.jsdelivr.net/gh/rararaforever/orbit-fonts@main/avara/Avara-Bold.woff2")
            format("woff2"),
          url("https://cdn.jsdelivr.net/gh/rararaforever/orbit-fonts@main/avara/Avara-Bold.woff")
            format("woff");
        font-weight: 700;
        font-display: swap;
      }

      @font-face {
        font-family: avara;
        src:
          url("https://cdn.jsdelivr.net/gh/rararaforever/orbit-fonts@main/avara/Avara-BoldItalic.woff2")
            format("woff2"),
          url("https://cdn.jsdelivr.net/gh/rararaforever/orbit-fonts@main/avara/Avara-BoldItalic.woff")
            format("woff");
        font-weight: 700;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: xx1;
        src: url("https://cdn.jsdelivr.net/gh/rararaforever/orbit-fonts@main/xx/xxAmour-fort.ttf")
          format("truetype");
        font-display: swap;
      }

      @font-face {
        font-family: xx2;
        src: url("https://cdn.jsdelivr.net/gh/rararaforever/orbit-fonts@main/xx/xxDopamine-Mono.ttf")
          format("truetype");
        font-display: swap;
      }

      @font-face {
        font-family: xx3;
        src: url("https://cdn.jsdelivr.net/gh/rararaforever/orbit-fonts@main/xx/xxLiberte-Grotesque.ttf")
          format("truetype");
        font-display: swap;
      }

      @font-face {
        font-family: xx4;
        src: url("https://cdn.jsdelivr.net/gh/rararaforever/orbit-fonts@main/xx/xxQueen-basic.ttf")
          format("truetype");
        font-display: swap;
      }

      @font-face {
        font-family: xx5;
        src: url("https://cdn.jsdelivr.net/gh/rararaforever/orbit-fonts@main/xx/xxQueen-juicy.ttf")
          format("truetype");
        font-display: swap;
      }

      @font-face {
        font-family: xx6;
        src: url("https://cdn.jsdelivr.net/gh/rararaforever/orbit-fonts@main/xx/xxStardust-super.ttf")
          format("truetype");
        font-display: swap;
      }

      @font-face {
        font-family: xx7;
        src: url("https://cdn.jsdelivr.net/gh/rararaforever/orbit-fonts@main/xx/xxTreasure-radical.ttf")
          format("truetype");
        font-display: swap;
      }

      /* ---- Terminal Grotesque ---- */
      @font-face {
        font-family: terminal;
        src:
          url("https://cdn.jsdelivr.net/gh/rararaforever/orbit-fonts@main/terminal/terminal-grotesque-webfont.woff2")
            format("woff2"),
          url("https://cdn.jsdelivr.net/gh/rararaforever/orbit-fonts@main/terminal/terminal-grotesque-webfont.woff")
            format("woff");
        font-display: swap;
      }

      /* ---- Redaction ---- */
      @font-face {
        font-family: redaction;
        src: url("https://cdn.jsdelivr.net/gh/rararaforever/orbit-fonts@main/redaction/Redaction-Regular.woff2")
          format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: redaction;
        src: url("https://cdn.jsdelivr.net/gh/rararaforever/orbit-fonts@main/redaction/Redaction-Italic.woff2")
          format("woff2");
        font-weight: 400;
        font-style: italic;
        font-display: swap;
      }

      @font-face {
        font-family: redaction;
        src: url("https://cdn.jsdelivr.net/gh/rararaforever/orbit-fonts@main/redaction/Redaction-Bold.woff2")
          format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
    </style>
    <!-- <link rel="stylesheet" href="./spotlight/spotlight.css" /> -->
    <link rel="stylesheet" href="./archive-1.css" />
  </head>
  <body>
    <div
      class="archive-loading"
      id="archiveLoading"
      role="status"
      aria-live="polite"
      aria-busy="true"
    >
      <span class="archive-loading__spinner" aria-hidden="true"></span>
      <span class="archive-loading__message">Loading archive...</span>
    </div>
    <div class="header">
      <div class="header--container">
        <div class="header__title--container">
          <div class="header__title">Reel Asian Archive</div>
        </div>
        <div class="header__links--container">
          <a href="" class="header__link">How to</a>
          <a href="" class="header__link">About</a>
        </div>
      </div>
      <div class="filter--parent">
        <div class="filter--container" id="filter__container"></div>
        <div class="filter__backdrop"></div>
      </div>
    </div>

    <div class="tiger"></div>
    <div class="pagination--container">
      <div class="pagination"></div>
      <div class="viewmenu--container">
        <div class="view__title">view toggles</div>
        <div class="viewbtn--container">
          <div class="viewoptions--container" data-view-control="grid">
            <label for="gridSlider">Columns: <span id="gridValue">3</span></label>
            <input id="gridSlider" type="range" min="1" max="5" value="3" step="1" />
          </div>
          <div class="viewoptions--container" data-view-control="list" hidden>
            <label for="rowSlider">Row size: <span id="rowValue">280</span>px</label>
            <input id="rowSlider" type="range" min="180" max="500" value="280" step="20" />
          </div>
          <button class="view__btn active" type="button" data-view="grid" aria-label="Grid view" aria-pressed="true">Grid</button>
          <button class="view__btn" type="button" data-view="list" aria-label="List view" aria-pressed="false">List</button>
          <button class="view__btn" type="button" data-view="randomizer" aria-label="Random project picker" aria-pressed="false">Random</button>
        </div>
      </div>
    </div>
  </body>
  <!-- <script src="./archive-v2.js"></script> -->
  <script src="./archive-refactor.js"></script>
</html>
